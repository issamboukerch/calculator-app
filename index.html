<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #2a2b4e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }

        /* Calculator Card */
        main {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 320px;
        }

        #input {
            margin-bottom: 20px;
        }

        #result {
            width: 100%;
            height: 70px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            font-size: 2rem;
            color: #ffffff;
            text-align: right;
            padding: 0 16px;
            outline: none;
            box-sizing: border-box;
        }

        #buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #buttons div {
            display: flex;
            gap: 12px;
            justify-content: space-between;
        }

        button {
            flex: 1;
            height: 55px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Accent Colors for Special Buttons */
        .btn-op {
            background: rgba(74, 144, 226, 0.2);
            color: #64b5f6;
        }
        .btn-op:hover {
            background: rgba(74, 144, 226, 0.35);
        }

        .btn-action {
            background: rgba(239, 83, 80, 0.2);
            color: #ef5350;
        }
        .btn-action:hover {
            background: rgba(239, 83, 80, 0.35);
        }

        #equle {
            background: linear-gradient(135deg, #42a5f5, #1e88e5);
            color: white;
            flex: 2;
        }
        #equle:hover {
            background: linear-gradient(135deg, #64b5f6, #2196f3);
        }
    </style>
</head>
<body>
    <main>
        <section id="input">
            <input id="result" type="text" value="0" disabled />
        </section>
        <section id="buttons">
            <div id="row-one">
                <button class="btn-action" onclick="AC()">AC</button>
                <button class="btn-action" onclick="DL()">DL</button>
                <button class="btn-op" onclick="addValue('%')">%</button>
                <button class="btn-op" onclick="addValue('/')">÷</button>
            </div>
            <div id="row-two">
                <button onclick="addValue('7')">7</button>
                <button onclick="addValue('8')">8</button>
                <button onclick="addValue('9')">9</button>
                <button class="btn-op" onclick="addValue('*')">×</button>
            </div>
            <div id="row-three">
                <button onclick="addValue('4')">4</button>
                <button onclick="addValue('5')">5</button>
                <button onclick="addValue('6')">6</button>
                <button class="btn-op" onclick="addValue('-')">-</button>
            </div>
            <div id="row-four">
                <button onclick="addValue('1')">1</button>
                <button onclick="addValue('2')">2</button>
                <button onclick="addValue('3')">3</button>
                <button class="btn-op" onclick="addValue('+')">+</button>
            </div>
            <div id="row-five">
                <button onclick="addValue('00')">00</button>
                <button onclick="addValue('0')">0</button>
                <button onclick="addValue('.')">.</button>
                <button onclick="calculate('=')" id="equle">=</button>
            </div>
        </section>
    </main>

    <script>
        const resultInput = document.getElementById('result');
        let currentExpression = '0';

        function updateDisplay() {
            resultInput.value = currentExpression;
        }

        function AC() {
            currentExpression = '0';
            updateDisplay();
        }

        function DL() {
            if (currentExpression.length > 1) {
                currentExpression = currentExpression.slice(0, -1);
            } else {
                currentExpression = '0';
            }
            updateDisplay();
        }

        function addValue(val) {
            if (currentExpression === '0' && val !== '.') {
                currentExpression = val;
            } else {
                currentExpression += val;
            }
            updateDisplay();
        }

        function calculate() {
            try {
                let sanitizedExpression = currentExpression.replace(/×/g, '*').replace(/÷/g, '/');
                let evalResult = eval(sanitizedExpression);
                
                if (!Number.isInteger(evalResult)) {
                    evalResult = parseFloat(evalResult.toFixed(6));
                }

                currentExpression = evalResult.toString();
                updateDisplay();
            } catch (error) {
                resultInput.value = 'Error';
                setTimeout(() => {
                    currentExpression = '0';
                    updateDisplay();
                }, 1200);
            }
        }

        // Physical keyboard responsiveness
        document.addEventListener('keydown', (e) => {
            if ((e.key >= '0' && e.key <= '9') || e.key === '.' || e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
                addValue(e.key);
            } else if (e.key === 'Enter' || e.key === '=') {
                calculate();
            } else if (e.key === 'Backspace') {
                DL();
            } else if (e.key === 'Escape') {
                AC();
            }
        });
    </script>
</body>
</html>
