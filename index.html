<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #2a2b4e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 700px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        /* Calculator Card */
        main {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 320px;
        }

        #input {
            margin-bottom: 20px;
        }

        #result {
            width: 100%;
            height: 70px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            font-size: 2rem;
            color: #ffffff;
            text-align: right;
            padding: 0 16px;
            outline: none;
            box-sizing: border-box;
        }

        #buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #buttons div {
            display: flex;
            gap: 12px;
            justify-content: space-between;
        }

        button {
            flex: 1;
            height: 55px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Accent Colors for Special Buttons */
        .btn-op {
            background: rgba(74, 144, 226, 0.2);
            color: #64b5f6;
        }
        .btn-op:hover {
            background: rgba(74, 144, 226, 0.35);
        }

        .btn-action {
            background: rgba(239, 83, 80, 0.2);
            color: #ef5350;
        }
        .btn-action:hover {
            background: rgba(239, 83, 80, 0.35);
        }

        #equle {
            background: linear-gradient(135deg, #42a5f5, #1e88e5);
            color: white;
            flex: 2;
        }
        #equle:hover {
            background: linear-gradient(135deg, #64b5f6, #2196f3);
        }

        /* History Panel */
        .history-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 20px;
            width: 260px;
            max-height: 420px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #b0bec5;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .clear-history {
            background: transparent;
            border: none;
            color: #ef5350;
            font-size: 0.8rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            height: auto;
            box-shadow: none;
        }
        .clear-history:hover {
            background: rgba(239, 83, 80, 0.1);
            transform: none;
        }

        .history-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
            padding-right: 4px;
        }

        .history-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #cfd8dc;
            word-break: break-all;
        }

        .history-item span {
            display: block;
            font-size: 0.75rem;
            color: #90a4ae;
            text-align: right;
            margin-top: 2px;
        }

        @media (max-width: 620px) {
            .history-panel {
                width: 320px;
                max-height: 200px;
            }
        }
    </style>
</head>
<body>
    
    <div class="container">
        <main>
            <section id="input">
                <input id="result" type="text" value="0" disabled />
            </section>
            <section id="buttons">
                <div id="row-one">
                    <button class="btn-action" onclick="AC()">AC</button>
                    <button class="btn-action" onclick="DL()">DL</button>
                    <button class="btn-op" onclick="addValue('%')">%</button>
                    <button class="btn-op" onclick="addValue('/')">÷</button>
                </div>
                <div id="row-two">
                    <button onclick="addValue('7')">7</button>
                    <button onclick="addValue('8')">8</button>
                    <button onclick="addValue('9')">9</button>
                    <button class="btn-op" onclick="addValue('*')">×</button>
                </div>
                <div id="row-three">
                    <button onclick="addValue('4')">4</button>
                    <button onclick="addValue('5')">5</button>
                    <button onclick="addValue('6')">6</button>
                    <button class="btn-op" onclick="addValue('-')">-</button>
                </div>
                <div id="row-four">
                    <button onclick="addValue('1')">1</button>
                    <button onclick="addValue('2')">2</button>
                    <button onclick="addValue('3')">3</button>
                    <button class="btn-op" onclick="addValue('+')">+</button>
                </div>
                <div id="row-five">
                    <button onclick="addValue('00')">00</button>
                    <button onclick="addValue('0')">0</button>
                    <button onclick="addValue('.')">.</button>
                    <button onclick="calculate('=')" id="equle">=</button>
                </div>
            </section>
        </main>

        <!-- History Panel -->
        <aside class="history-panel">
            <div class="history-header">
                <span>History</span>
                <button class="clear-history" onclick="clearHistory()">Clear</button>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-item" style="text-align: center; color: #78909c;">No history yet</div>
            </div>
        </aside>
    </div>

    <script>
        const resultInput = document.getElementById('result');
        const historyList = document.getElementById('historyList');
        let currentExpression = '0';
        let history = [];

        function updateDisplay() {
            resultInput.value = currentExpression;
        }

        function AC() {
            currentExpression = '0';
            updateDisplay();
        }

        function DL() {
            if (currentExpression.length > 1) {
                currentExpression = currentExpression.slice(0, -1);
            } else {
                currentExpression = '0';
            }
            updateDisplay();
        }

        function addValue(val) {
            if (currentExpression === '0' && val !== '.') {
                currentExpression = val;
            } else {
                currentExpression += val;
            }
            updateDisplay();
        }

        function calculate() {
            try {
                // Safely evaluate standard math expressions
                let sanitizedExpression = currentExpression.replace(/×/g, '*').replace(/÷/g, '/');
                let evalResult = eval(sanitizedExpression);
                
                // Format decimal results if needed
                if (!Number.isInteger(evalResult)) {
                    evalResult = parseFloat(evalResult.toFixed(6));
                }

                const record = `${currentExpression} = ${evalResult}`;
                history.unshift(record);
                renderHistory();

                currentExpression = evalResult.toString();
                updateDisplay();
            } catch (error) {
                resultInput.value = 'Error';
                setTimeout(() => {
                    currentExpression = '0';
                    updateDisplay();
                }, 1200);
            }
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<div class="history-item" style="text-align: center; color: #78909c;">No history yet</div>';
                return;
            }
            historyList.innerHTML = history.map(item => {
                const parts = item.split(' = ');
                return `<div class="history-item">${parts[0]}<span>= ${parts[1]}</span></div>`;
            }).join('');
        }

        function clearHistory() {
            history = [];
            renderHistory();
        }

        // Optional: Add physical keyboard responsiveness
        document.addEventListener('keydown', (e) => {
            if ((e.key >= '0' && e.key <= '9') || e.key === '.' || e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
                addValue(e.key);
            } else if (e.key === 'Enter' || e.key === '=') {
                calculate();
            } else if (e.key === 'Backspace') {
                DL();
            } else if (e.key === 'Escape') {
                AC();
            }
        });
    </script>
</body>
</html>
